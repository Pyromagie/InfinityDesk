[package]
name = "infinitydesk"
version = "0.1.0"
edition = "2024"

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }
tracing = "0.1"
# Window rules match app ids and titles like niri does.
regex = "1"
# Pointer images from the cursor theme (standalone, where nobody else draws the pointer).
xcursor = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Gepinnt auf einen festen Commit, damit sich die API nicht unter uns ändert.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "33323a917af13676875c27fb7748ffdaea5f4c2f"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # Standalone session: screen (DRM/KMS), GPU buffers, input devices, seat access.
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
]

# Test windows for the tests without a screen (`tests/headless.rs`); the same versions smithay's
# nested backend already uses.
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
